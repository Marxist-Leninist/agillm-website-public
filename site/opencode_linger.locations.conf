# Minimal Linger plumbing for OpenCode only.
# X-Owner-Access is forced to 0 so non-laptop IPs cannot inherit the broader
# AGILLM IP trust map and must possess a real Linger session.

location = /_opencode_linger_check {
    internal;
    satisfy any;
    allow all;
    auth_request off;
    proxy_pass http://127.0.0.1:8795/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Owner-Access 0;
    proxy_set_header Host 127.0.0.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 2s;
}

location @opencode_linger_page {
    satisfy any;
    allow all;
    auth_request off;
    rewrite ^ / break;
    proxy_pass http://127.0.0.1:8795;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
}

location ^~ /agillm-linger/ {
    satisfy any;
    allow all;
    auth_request off;
    proxy_pass http://127.0.0.1:8795/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
}

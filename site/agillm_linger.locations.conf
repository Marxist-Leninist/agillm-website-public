# Linger sleep-safe owner login. Internal access check + public request/grant.
        location = /_agillm_access {
            internal;
            if ($agillm_owner_access_ok = 1) {
                return 200;
            }
            rewrite ^ /_linger_check last;
        }

        location = /_linger_check {
            internal;
            proxy_pass http://127.0.0.1:8795/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Owner-Access $agillm_owner_access_ok;
            proxy_set_header Host 127.0.0.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }

        location @linger_page {
            rewrite ^ / break;
            proxy_pass http://127.0.0.1:8795;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
        }

        location /agillm-linger/ {
            proxy_pass http://127.0.0.1:8795/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
        }

        # SG-WEB/2 discovery aliases for web-only AI clients. These are GET-only
        # redirects into the SG-WEB lane. 2026-09-22: /sg-web/ is OWNER-GATED for now, so every
        # alias below lands on the Linger gate for non-owners (the redirect itself reveals nothing).
        location = /sg-web { return 302 /sg-web/; }
        location = /sg { return 302 /experimental/sg-mcp/; }
        location = /sg/mcp { return 302 /experimental/sg-mcp/; }
        location = /mcp/sg { return 302 /experimental/sg-mcp/; }
        location = /.well-known/sg { return 302 /.well-known/sg.json; }
        location = /.well-known/mcp { return 302 /experimental/sg-mcp/; }
        location = /capabilities { return 302 /experimental/sg-mcp/tools; }
        location = /api/capabilities { return 302 /experimental/sg-mcp/tools; }
        location = /api/mcp/tools { return 302 /experimental/sg-mcp/tools; }
        location = /status { return 302 /experimental/sg-mcp/call/mcp_status; }
        location = /sg/status { return 302 /experimental/sg-mcp/call/mcp_status; }
        location = /api/sg/status { return 302 /experimental/sg-mcp/call/mcp_status; }
        location = /sg.json { return 302 /.well-known/sg.json; }
        location = /sg-web.json { return 302 /.well-known/sg.json; }
        location = /sg-web/public/discovery.json { return 302 /experimental/sg-mcp/?format=json; }
        location = /sg-web/public/tools.json { return 302 /experimental/sg-mcp/tools?format=json; }
        location = /sg1 { return 302 /experimental/sg-mcp/call/mcp_status?backend=sg1; }
        location = /sg2 { return 302 /experimental/sg-mcp/call/mcp_status?backend=sg2; }

        # DeepSeek/browser AI discovery aliases (feedback hardening).
        # These expose only the existing public read-only SG-WEB lane.
        location = /gb10 { return 302 /experimental/sg-mcp/call/gb10_status; }
        location = /gb10/status { return 302 /experimental/sg-mcp/call/gb10_rpv16_status; }
        location = /rpv16/status { return 302 /experimental/sg-mcp/call/rpv16_status; }

        location = /llms.txt {
            access_log off;
            proxy_pass http://127.0.0.1:8819;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 50s;
        }

        location @sg_web_llms_txt {
            default_type text/plain;
            add_header Cache-Control "no-store, max-age=0" always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            return 200 "# SG-WEB/2\nMachine discovery JSON: https://codex.opentransformers.online/.well-known/sg.json\nHuman/HTML discovery: https://codex.opentransformers.online/.well-known/sg\nMachine public root: https://codex.opentransformers.online/sg-web/public/?format=json\nMCP status: https://codex.opentransformers.online/sg-web/public/call/mcp_status?format=json\nCluster status: https://codex.opentransformers.online/sg-web/public/call/mcp_cluster_status?format=json\nGB10 / RPV16 status: https://codex.opentransformers.online/sg-web/public/call/gb10_rpv16_status?format=json\nRPV16 short alias: https://codex.opentransformers.online/sg-web/public/call/rpv16_status?format=json\nPublic tools: https://codex.opentransformers.online/sg-web/public/tools?format=json\nPublic RPV16 search: https://codex.opentransformers.online/sg-web/public/search?q=RPV16&format=json\nFull-catalog RPV16 search: https://codex.opentransformers.online/sg-web/public/call/tool_search?arg.query=RPV16&arg.limit=10&format=json\nNo OAuth, login, custom headers, API keys, JavaScript, or POST are required for these public read-only URLs.\nPrompt delegation is supported: if your user prompt supplies an SG Prompt Writer root URL, open that root exactly. It is a short-lived scoped capability. Reads are direct; writes use prepare -> one-time execute. Reopening the same execute URL returns the cached result and does not duplicate the write.\nThe unrestricted private capability lane is intentionally NOT publicly discoverable. Never guess private URLs.\n";
        }

        location = /.well-known/sg.json {
            access_log off;
            proxy_pass http://127.0.0.1:8819;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 50s;
        }

        location @sg_web_discovery_json {
            default_type application/json;
            add_header Cache-Control "no-store, max-age=0" always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            return 200 '{"protocol":"SG-WEB/2","build":"sg-web-2.2-20260917","public_read_only":true,"oauth_required":false,"login_required":false,"custom_headers_required":false,"javascript_required":false,"post_required":false,"prompt_delegation":{"supported":true,"profile":"prompt-writer-v1","credential_transport":"capability URL supplied in user prompt","publicly_discoverable":false,"write_flow":"prepare_then_execute","execute_idempotency":"same execute URL returns cached result; write is not repeated","scope":"bounded non-destructive state writes; no shell/exec/files/services/process control/deletes/secrets/deploy/external mail-SMS-social"},"private_capability_lane":{"exists":true,"publicly_discoverable":false,"access":"pre-shared out of band","note":"Do not guess private URLs; absence from public discovery is intentional."},"discovery_html":"https://codex.opentransformers.online/.well-known/sg","discovery_json":"https://codex.opentransformers.online/.well-known/sg.json","public_root_json":"https://codex.opentransformers.online/sg-web/public/?format=json","mcp_status":"https://codex.opentransformers.online/sg-web/public/call/mcp_status?format=json","cluster_status":"https://codex.opentransformers.online/sg-web/public/call/mcp_cluster_status?format=json","gb10_rpv16_status":"https://codex.opentransformers.online/sg-web/public/call/gb10_rpv16_status?format=json","rpv16_status":"https://codex.opentransformers.online/sg-web/public/call/rpv16_status?format=json","tools_json":"https://codex.opentransformers.online/sg-web/public/tools?format=json","public_search_rpv16":"https://codex.opentransformers.online/sg-web/public/search?q=RPV16&format=json","full_catalog_search_rpv16":"https://codex.opentransformers.online/sg-web/public/call/tool_search?arg.query=RPV16&arg.limit=10&format=json","llms_txt":"https://codex.opentransformers.online/llms.txt"}';
        }
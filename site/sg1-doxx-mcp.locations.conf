# Public SG1 OAuth and MCP routes for https://doxx.lat.
# Only these paths cross GETH's private Hetzner link to goddess-mcp.

location ~ ^/(?:\.well-known/oauth-authorization-server|\.well-known/oauth-protected-resource(?:/mcp)?|authorize|token|jwks\.json|register)$ {
    proxy_pass http://x.x.x.x;
    proxy_http_version 1.1;
    proxy_set_header Host doxx.lat;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

location = /mcp {
    client_max_body_size 64m;
    proxy_pass http://x.x.x.x;
    proxy_http_version 1.1;
    proxy_set_header Host doxx.lat;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
    proxy_buffering off;
}

location ^~ /mcp/ {
    client_max_body_size 64m;
    proxy_pass http://x.x.x.x;
    proxy_http_version 1.1;
    proxy_set_header Host doxx.lat;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 86400s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
}

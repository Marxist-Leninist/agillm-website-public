.af-note{margin:9px 0 0;color:#8699b2;font-size:10px;line-height:1.5}

#doc:focus{outline:none}

@media(min-width:1281px){#workspace{gap:12px!important}#agillmTelemetry{margin:8px 14px 0!important}.af-card{padding:11px 14px}.af-grid{gap:12px}}
@media(max-width:900px){.af-grid{grid-template-columns:1fr}.af-card{padding:10px 12px}.af-card header{margin-bottom:6px}.af-metric b{font-size:17px}.af-checkpoint{margin-top:7px;padding-top:6px}.af-top{align-items:flex-start}.af-top strong{display:block}.af-top span{font-size:10px}#agillmTelemetry:not(.is-collapsed){max-height:35vh!important}.af-details{margin-top:5px}}

.af-save-status strong{color:#d7e5f5;font-weight:650}
.af-checkpoint-updated{margin-top:2px;color:#aebed1;font-variant-numeric:tabular-nums}

</style>

/* Checkpoint timestamps. Callers must pass checkpoint metadata, not poll times. */
(function (root, factory) {

  const api = factory();

  'use strict';

    timeZone: 'Europe/London', year: 'numeric', month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
    timeZoneName: 'short'

  function parse(value) {
    let ms = NaN;
    if (typeof value === 'number') {

    const delta = now - ms;
    if (!Number.isFinite(delta)) return '';
    if (delta < -60000) return 'timestamp is ahead of this device';
    const minutes = Math.floor(Math.max(0, delta) / 60000);
    if (minutes === 0) return 'less than a minute ago';
    if (minutes < 60) return minutes + ' min ago';
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + ' h' + (minutes % 60 ? ' ' + minutes % 60 + ' min' : '') + ' ago';

    return days + (days === 1 ? ' day' : ' days') + ' ago';
  }

  function format(value, now = Date.now()) {
    const ms = parse(value);
    if (ms === null) return null;
    return {
      ms,
      iso: new Date(ms).toISOString(),
      absolute: absoluteFormatter.format(ms),
      relative: age(ms, now)

  function render(target, value, options = {}) {

    const doc = target.ownerDocument;
    const result = format(value, options.now === undefined ? Date.now() : options.now);

    target.classList.add('checkpoint-last-updated');
    if (!result) {
      target.textContent = label + ': time unavailable';
      target.removeAttribute('title');
      return false;
    }
    const time = doc.createElement('time');
    time.dateTime = result.iso;
    time.textContent = result.absolute;
    time.title = result.iso + (options.source ? ' · ' + options.source : '');
    const relative = doc.createElement('span');
    relative.className = 'checkpoint-age';
    relative.textContent = result.relative ? ' (' + result.relative + ')' : '';
    target.replaceChildren(doc.createTextNode(label + ': '), time, relative);
    target.title = options.source || 'Checkpoint timestamp; not the page refresh time.';
    return true;
  }

  return Object.freeze({ parse, age, format, render });

(()=>{

function chart(history){

 const pts=values.map((v,i)=>(i/(values.length-1)*300).toFixed(1)+','+(35-(v-lo)/span*29).toFixed(1)).join(' ');
 return '<svg class="af-chart" viewBox="0 0 300 40" preserveAspectRatio="none" role="img" aria-label="Recent Binary 4B training throughput, '+esc(fmt(lo))+' to '+esc(fmt(hi))+' tokens per second"><polyline fill="none" stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke" points="'+pts+'"/></svg>';

function checkpointTimeMarkup(value){

 if(!f)return '<span class="af-time-unavailable">Time unavailable</span>';

function card(key,open){

 let details=[['Trainer step',fmt(t.step)],['Latest saved',fmt(t.saved)],['Seen tokens',compact(t.seen)],['Source updated',ageText(t.age)]];

  details.push(['Validated checkpoint',fmt(t.validated)],['Mean per-net eval loss',fmt(t.validation,3)],['ParScale',typeof h?.parscale==='object'?'P'+fmt(h.parscale.streams):number(t.ps)!==null?'P'+fmt(t.ps):'—']);

function render(){

 if(!box){box=document.createElement('section');box.id='agillmFleetMonitor';box.setAttribute('aria-label','Live training and serving checkpoints for all three models');const old=document.getElementById('agi-live');old?old.before(box):rail.append(box);}
 const opened=new Set([...box.querySelectorAll('.af-details[open]')].map(d=>d.closest('.af-card').dataset.model));
 const focused=document.activeElement?.closest('#agillmFleetMonitor');const focusKey=focused?.closest('.af-card')?.dataset.model;const focusRefresh=document.activeElement?.id==='afRefresh';

 box.innerHTML='<div class="af-top"><div><strong>Three models. One live view.</strong><span id="afFreshness"> '+count+'/3 telemetry feeds fresh · refresh every 30s</span></div><button type="button" id="afRefresh" aria-label="Refresh training telemetry"'+(state.busy?' disabled':'')+'>Refresh</button></div><div class="af-grid">'+Object.keys(labels).map(k=>card(k,opened.has(k))).join('')+'</div><p class="af-note">Training steps and saved checkpoints are not the same as the weights answering your requests. Serving rows come from each model’s live health endpoint. Delayed cards retain their last known values.</p>';

  if(checkpoint&&h?.ready)checkpoint.textContent='Binary 4B · serving #'+fmt(servingStep(h));

}
async function get(url){const c=new AbortController(),timeout=setTimeout(()=>c.abort(),8000);try{const r=await fetch(url,{cache:'no-store',signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json();}finally{clearTimeout(timeout);}}

 if(state.busy)return;state.busy=true;
 const tasks=[['fleet','/api/training?history=0'],['binary','/agillm-bintf4b-training.json'],...Object.entries(healthURLs)];

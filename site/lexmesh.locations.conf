# LexMesh prototype (lawyer case management demo). Scoped public path on the
# otherwise-closed doxx.lat host; proxies to the loopback lexmesh service.
location = /lexmesh { return 301 /lexmesh/; }
location ^~ /lexmesh/ {
    proxy_pass http://x.x.x.x:31900;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 60s;
    proxy_buffering off;
    client_max_body_size 2m;
}

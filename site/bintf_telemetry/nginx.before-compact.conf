            proxy_cache off;
            chunked_transfer_encoding on;
            client_max_body_size 2m;
        }


        # Detachable 49.1M popup routes use a dedicated one-worker AR service.
        # There is deliberately no proxy_next_upstream fallback.
        location = /agillm-popout-health {
            include /opt/agillm43_netserve/agillm_codex_browser_allow.conf;
            include /opt/agillm43_netserve/agillm_acl.conf;
            proxy_pass http://agillm44_popup_backend/health;
            proxy_next_upstream off;
            proxy_set_header Host $host;
            proxy_set_header X-AGILLM-Token "REDACTED";
            proxy_read_timeout 30s;
            proxy_buffering off;
        }

        location = /agillm-popout-gen {
            include /opt/agillm43_netserve/agillm_codex_browser_allow.conf;
            include /opt/agillm43_netserve/agillm_acl.conf;
            proxy_pass http://agillm44_popup_backend/infer;
            proxy_next_upstream off;
            proxy_set_header Host $host;
            proxy_set_header X-AGILLM-Token "REDACTED";
            proxy_read_timeout 1800s;
            proxy_buffering off;
            client_max_body_size 2m;
        }

        location = /agillm-popout-cancel {
            include /opt/agillm43_netserve/agillm_codex_browser_allow.conf;
            include /opt/agillm43_netserve/agillm_acl.conf;
            proxy_pass http://agillm44_popup_backend/cancel;
            proxy_next_upstream off;
            proxy_set_header Host $host;
            proxy_set_header X-AGILLM-Token "REDACTED";
            proxy_read_timeout 30s;
            proxy_buffering off;
            client_max_body_size 4k;
        }

        location = /agillm-popout-stream {
            include /opt/agillm43_netserve/agillm_codex_browser_allow.conf;
            include /opt/agillm43_netserve/agillm_acl.conf;
            proxy_pass http://agillm44_popup_backend/stream;
            proxy_next_upstream off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-AGILLM-Token "REDACTED";
            proxy_read_timeout 600s;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            client_max_body_size 2m;
        }


        location = /agillm-chat/ {
            return 308 /agillm-chat$is_args$args;
        }

        location = /agillm-chat {
            include /opt/agillm43_netserve/agillm_acl.conf;
            error_page 401 = @linger_page;
            error_page 403 = @linger_page;
            etag off;
            if_modified_since off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            alias /opt/agillm43_netserve/agillm_sft_chat.html;
            default_type text/html;
        }

        location = /agillm-chat-gen {
            include /opt/agillm43_netserve/agillm_acl.conf;
            proxy_pass http://agillm43_sft_chat_backend/infer;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_set_header Host $host;
            proxy_set_header X-AGILLM-Token "REDACTED";
            proxy_read_timeout 1800s;
            proxy_buffering off;
            client_max_body_size 2m;
        }

        location = /agillm-chat-cancel {
            include /opt/agillm43_netserve/agillm_acl.conf;
            proxy_pass http://agillm43_sft_chat_backend/cancel;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_set_header Host $host;
            proxy_set_header X-AGILLM-Token "REDACTED";
            proxy_read_timeout 30s;
            proxy_buffering off;
            client_max_body_size 4k;
        }

        location = /agillm-chat-stream {
            include /opt/agillm43_netserve/agillm_acl.conf;
            proxy_pass http://agillm43_sft_chat_backend/stream;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-AGILLM-Token "REDACTED";
            proxy_read_timeout 600s;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            client_max_body_size 2m;
        }

        # Owner-restricted, no-cache status for the versioned v23 checkpoint handoff.
        location = /agillm-v23-status {
            include /opt/agillm43_netserve/agillm_acl.conf;
            etag off;
            if_modified_since off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            alias /opt/agillm43_netserve/agillm_v23_status.json;
            default_type application/json;
        }

        location = /models {
            include /opt/agillm43_netserve/agillm_acl.conf;
            alias /opt/agillm43_netserve/models_hub.html;
            default_type text/html;
        }

        # Owner-only MeshDirect website/APK fallback. This mirrors the zqx.lat
        # route on the direct codex origin for carrier or Cloudflare failures.
        location = /qwen38 {
            if ($meshdirect_owner_cli_autoauth = 0) { return 404; }
            return 308 /qwen38/;
        }

        # SG Mail reaches this endpoint only through the source-restricted private relay.
        location = /qwen38/api/internal/mail-auto/v1/chat/completions { return 404; }
        location = /api/internal/mail-auto/v1/chat/completions { return 404; }

        location ^~ /qwen38/ {
            if ($meshdirect_owner_cli_autoauth = 0) { return 404; }
            client_max_body_size 20m;
            client_body_timeout 120s;
            proxy_pass http://127.0.0.1:31841;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-MeshDirect-Owner-Autoauth $meshdirect_owner_cli_autoauth;
            proxy_set_header X-MeshDirect-Owner-Proof "71c75f20c1a9019018651fabc5204768c108210de62d1c24fa2e10618a0a240c";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $qwen38_connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
        }

        # Stable owner-facing shortcut to the private OpenCode PWA.
        # The target host remains owner-gated; this merely gives the SG site a memorable route.
        location = /opencode {
            add_header Cache-Control "no-store" always;
            return 302 https://join.doxx.lat/;
        }
        location = /opencode/ {
            return 308 /opencode;
        }

        # The canonical codex landing page is the AGILLM completion UI.
        location = / {
            return 302 /agillm-ui;
        }

        location / {
            return 404;
        }
    }

    # SG1 OAuth/MCP edge. doxx.lat remains closed by default; only the
    # authenticated MCP surface and its OAuth endpoints are exposed.
    server {
        listen x.x.x.x:443 ssl;
        server_name doxx.lat;

        ssl_certificate /etc/letsencrypt/live/doxx.lat/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/doxx.lat/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        access_log /var/log/nginx/sg1-doxx-mcp.access.log;
        include /opt/agillm43_netserve/sg1-doxx-mcp.locations.conf;
        include /opt/agillm43_netserve/lexmesh.locations.conf;

        location / {
            return 404;
        }
    }

    # zqx.lat keeps its public landing page on the isolated HTTP origin, while
    # the private Qwen GUI is routed directly and limited to the owner device.
    server {
        listen x.x.x.x:443 ssl;
        server_name zqx.lat www.zqx.lat;

        # sgir-fix 2026-08-04: dedicated zqx.lat cert (was serving codex's cert)
        ssl_certificate /etc/letsencrypt/live/zqx.lat/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zqx.lat/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        include /opt/agillm43_netserve/qwen38_tls_realip.conf;

        # Dedicated authenticated Cloud Desktop and device-node WebSocket
        # locations must win before the generic /qwen38/ application proxy.
        include /etc/nginx/snippets/meshdirect-cloud-desktop-location.conf;

        # SG3 laptop computer-use agent + hub (token-authenticated WebSocket).
        # Mirrors the /sg3cu/ location in zqx-isolated.conf; without it the
        # laptop agent's wss upgrade is silently downgraded and the hub 404s.
        location = /sg3cu/mcp { return 404; }

        location ^~ /sg3cu/ {
            access_log off;
            client_max_body_size 10m;
            proxy_pass http://127.0.0.1:31843/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $qwen38_connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 120s;
            proxy_request_buffering off;
        }

        location = /qwen38-gateway {
            if ($qwen38_owner_live = 0) { return 404; }
            return 308 /qwen38-gateway/;
        }

        location ^~ /qwen38-gateway/ {
            if ($qwen38_owner_live = 0) { return 404; }
            proxy_pass http://127.0.0.1:31839/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $qwen38_connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        location = /qwen38 {
            if ($qwen38_owner_live = 0) { return 404; }
            return 308 /qwen38/;
        }

        location ^~ /qwen38/openclaw/ {
            if ($qwen38_owner_live = 0) { return 404; }
            client_max_body_size 20m;   # MeshDirect accepts 18mb JSON (4 images ~12MB pre-base64)
            proxy_pass http://127.0.0.1:31838;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # Created by edge from IP whitelist; backend only trusts it with the proof header.
            proxy_set_header X-MeshDirect-Owner-Autoauth $meshdirect_owner_cli_autoauth;
            proxy_set_header X-MeshDirect-Owner-Proof "71c75f20c1a9019018651fabc5204768c108210de62d1c24fa2e10618a0a240c";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 600s;
            proxy_send_timeout 30s;
            proxy_buffering off;
        }

        location = /apk/qwen38-mesh-android-0.1.1-install.zip {
            add_header Cache-Control "no-store, max-age=0" always;
            return 302 https://codex.opentransformers.online/qwen38-install/qwen38-mesh-android-0.1.1-install.zip;
        }

        # Public APK links redirect to the direct origin mirror. The application
        # and APIs remain owner-network restricted; only signed release files move
        # off the carrier-sensitive Cloudflare/HTTP3 delivery path.
        location ^~ /apk/ {
            add_header Cache-Control "no-store, max-age=0" always;
            rewrite ^/apk/(.*)$ https://codex.opentransformers.online/qwen38-apk/$1 redirect;
        }

        # Backwards-compatible paths used by the first APK message. These are
        # exact public files, not a bypass around the private /qwen38/ prefix.
        location = /qwen38/downloads/qwen38-mesh-android-0.1.0.apk {
            add_header Cache-Control "no-store, max-age=0" always;
            return 302 https://codex.opentransformers.online/qwen38-apk/qwen38-mesh-android-0.1.0.apk;
        }

        location = /qwen38/downloads/qwen38-mesh-android.apk {
            add_header Cache-Control "no-store, max-age=0" always;
            return 302 https://codex.opentransformers.online/qwen38-apk/qwen38-mesh-android.apk;
        }

        location ^~ /qwen38/ {
            if ($qwen38_owner_live = 0) { return 404; }
            client_max_body_size 20m;   # MeshDirect accepts 18mb JSON (4 images ~12MB pre-base64)
            proxy_pass http://127.0.0.1:31841;
            # MeshDirect now emits its own root-scoped Secure, HttpOnly,
            # SameSite=Lax cookie and separate expiry cookies for legacy
            # /qwen38 paths. Rewriting those paths here would turn a legacy
            # expiry into Path=/ and immediately delete the fresh login cookie.
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # Created by edge from IP whitelist; backend only trusts it with the proof header.
            proxy_set_header X-MeshDirect-Owner-Autoauth $meshdirect_owner_cli_autoauth;
            proxy_set_header X-MeshDirect-Owner-Proof "71c75f20c1a9019018651fabc5204768c108210de62d1c24fa2e10618a0a240c";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 600s;
            proxy_send_timeout 30s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://x.x.x.x:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 30s;
            proxy_buffering off;
        }
    }

    # OPENCODE_PRIVATE_WEB_SERVER_BEGIN
    # Owner-only OpenCode PWA on the existing Cloudflare wildcard hostname.
    server {
        listen x.x.x.x:443 ssl;
        server_name opencode.doxx.lat;

        ssl_certificate /etc/letsencrypt/live/doxx.lat/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/doxx.lat/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # Cloudflare is the public peer. Restore the real device IP before the ACL.
        include /opt/agillm43_netserve/qwen38_tls_realip.conf;

        include /opt/agillm43_netserve/opencode_laptop_linger_acl.conf;
        include /opt/agillm43_netserve/opencode_linger.locations.conf;

        client_max_body_size 50m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        location / {
            proxy_pass http://127.0.0.1:4096;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $qwen38_connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
        }
    }
    # OPENCODE_PRIVATE_WEB_SERVER_END

    # OPENCODE_PRIVATE_WEB_JOIN_BEGIN
    # Gray-cloud (direct DNS) twin of the opencode.doxx.lat block: the CF-proxied
    # hostname is gated by a Cloudflare Worker whose allowlist we cannot edit
    # (no CF API token on this fleet). join.doxx.lat resolves straight to origin.
    server {
        listen x.x.x.x:443 ssl;
        server_name join.doxx.lat;

        ssl_certificate /etc/letsencrypt/live/join.doxx.lat/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/join.doxx.lat/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        include /opt/agillm43_netserve/qwen38_tls_realip.conf;

        include /opt/agillm43_netserve/opencode_laptop_linger_acl.conf;
        include /opt/agillm43_netserve/opencode_linger.locations.conf;

        client_max_body_size 2g;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        # BEGIN temporary checkpoint rescue 2990990
        location = /health {
            proxy_pass http://127.0.0.1:8787/health;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }
        location ^~ /api/v1/ {
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_request_buffering off;
            proxy_buffering off;
        }
        # END temporary checkpoint rescue 2990990

        # BEGIN owner-only Vast Runway APK
        location = /owner-apks/vast-runway.apk {
            alias /var/www/private-apk/VastRunway-v1.1.0.apk;
            default_type application/vnd.android.package-archive;
            add_header Cache-Control "private, no-store, max-age=0" always;
            add_header Content-Disposition 'attachment; filename="VastRunway-v1.1.0.apk"' always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Frame-Options DENY always;
        }

        location = /owner-apks/vast-runway-v1.1.0.apk {
            alias /var/www/private-apk/VastRunway-v1.1.0.apk;
            default_type application/vnd.android.package-archive;
            add_header Cache-Control "private, no-store, max-age=0" always;
            add_header Content-Disposition 'attachment; filename="VastRunway-v1.1.0.apk"' always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Frame-Options DENY always;
        }

        location = /owner-apks/vast-runway.apk.sha256 {
            alias /var/www/private-apk/VastRunway-v1.1.0.apk.sha256;
            default_type text/plain;
            add_header Cache-Control "private, no-store, max-age=0" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Frame-Options DENY always;
        }
        # END owner-only Vast Runway APK

        location / {
            proxy_pass http://127.0.0.1:4096;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $qwen38_connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
        }
    }
    # OPENCODE_PRIVATE_WEB_JOIN_END
}
# Vercel-only authenticated ingress for the SG MCP relay.
# The caller capability and Vercel OIDC token are consumed at this edge and
# stripped before forwarding to the private SG1/SG2 MCP backends.

location = /_sg_vercel_oidc_verify_codex {
    internal;
    proxy_pass http://127.0.0.1:18791/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-SG-Relay-Capability $http_x_sg_relay_capability;
}

location ^~ /_sg-vercel/sg1/ {
    access_log off;
    auth_request /_sg_vercel_oidc_verify_codex;
    client_max_body_size 64m;
    proxy_pass http://x.x.x.x:8095/;
    proxy_http_version 1.1;
    proxy_set_header Host x.x.x.x;
    proxy_set_header Authorization "";
    proxy_set_header X-SG-Relay-Capability "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 86400s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, noarchive, nosnippet" always;
}

location ^~ /_sg-vercel/sg2/ {
    access_log off;
    auth_request /_sg_vercel_oidc_verify_codex;
    client_max_body_size 64m;
    proxy_pass http://x.x.x.x:8095/;
    proxy_http_version 1.1;
    proxy_set_header Host x.x.x.x;
    proxy_set_header Authorization "";
    proxy_set_header X-SG-Relay-Capability "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 86400s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, noarchive, nosnippet" always;
}

location ^~ /_sg-vercel/auto/ {
    access_log off;
    auth_request /_sg_vercel_oidc_verify_codex;
    client_max_body_size 64m;
    proxy_pass http://x.x.x.x:8095/;
    proxy_http_version 1.1;
    proxy_set_header Host x.x.x.x;
    proxy_set_header Authorization "";
    proxy_set_header X-SG-Relay-Capability "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 86400s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors on;
    error_page 502 503 504 = @sg_vercel_auto_backup_codex;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, noarchive, nosnippet" always;
}

location @sg_vercel_auto_backup_codex {
    access_log off;
    proxy_pass http://x.x.x.x:8095;
    proxy_http_version 1.1;
    proxy_set_header Host x.x.x.x;
    proxy_set_header Authorization "";
    proxy_set_header X-SG-Relay-Capability "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 86400s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
}

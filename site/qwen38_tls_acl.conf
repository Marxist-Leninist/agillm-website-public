# Qwen38 owner-device ACL for the shared TLS edge.
# Trust CF-Connecting-IP only when the origin peer is a Cloudflare edge.
set_real_ip_from x.x.x.x;
set_real_ip_from x.x.x.x;
set_real_ip_from x.x.x.x;
set_real_ip_from x.x.x.x;
set_real_ip_from x.x.x.x;
set_real_ip_from x.x.x.x;
set_real_ip_from x.x.x.x;
set_real_ip_from x.x.x.x;
set_real_ip_from x.x.x.x;
set_real_ip_from x.x.x.x;
set_real_ip_from x.x.x.x;
set_real_ip_from x.x.x.x;
set_real_ip_from x.x.x.x;
set_real_ip_from x.x.x.x;
set_real_ip_from x.x.x.x;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

geo $qwen38_owner_network {
    default 0;
    x.x.x.x 1;
    x.x.x.x 1;
    x.x.x.x 1;
    x.x.x.x 1;  # owner phone address observed 2026-08-16
    x.x.x.x 1;  # Three UK mobile CGNAT rotates between subnets
    2a04:4a43:576f:a6c1:20e9:f8ff:fedd:8e5c/128 1;
    2a04:4a43::/32 1;  # Three UK mobile IPv6 owner network
    x.x.x.x 1;  # owner phone on venue Wi-Fi
    127.0.0.1/32 1;
    x.x.x.x 1;
    x.x.x.x 1;  # GETH external health-probe address
    2a01:4f8:c012:2128::1/128 1;  # GETH external IPv6 health-probe address
    include /etc/nginx/ip-passwordless-geth-geo.inc;
}

map $host $qwen38_host_ok {
    default 0;
    zqx.lat 1;
    www.zqx.lat 1;
}

map $http_upgrade $qwen38_connection_upgrade {
    default upgrade;
    '' close;
}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bonsai-27B</title>
<style>
  :root { --bg:#0b0f14; --panel:#141b22; --user:#1f6feb; --bot:#222c36; --text:#e6edf3; --muted:#8b98a5; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #app { display:flex; flex-direction:column; height:100dvh; max-width:820px; margin:0 auto; }
  header { padding:12px 16px; border-bottom:1px solid #222c36; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .dot { width:9px; height:9px; border-radius:50%; background:#3fb950; box-shadow:0 0 8px #3fb950; }
  header .sub { color:var(--muted); font-size:12px; margin-left:auto; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:88%; padding:10px 13px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.user { align-self:flex-end; background:var(--user); border-bottom-right-radius:4px; }
  .msg.bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
  .msg.sys { align-self:center; background:transparent; color:var(--muted); font-size:13px; text-align:center; max-width:100%; }
  form { display:flex; gap:8px; padding:10px; border-top:1px solid #222c36; background:var(--panel); }
  textarea { flex:1; resize:none; background:#0b0f14; color:var(--text); border:1px solid #2a3742;
    border-radius:12px; padding:11px 13px; font:inherit; max-height:140px; }
  button { background:var(--user); color:#fff; border:0; border-radius:12px; padding:0 18px; font:inherit;
    font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .blink::after { content:"▋"; animation:b 1s steps(2) infinite; }
  @keyframes b { 0%,50%{opacity:1} 50.1%,100%{opacity:0} }
  .nav { font-size:12px; color:var(--muted); text-decoration:none; border:1px solid var(--line); border-radius:8px; padding:3px 9px; margin-right:2px; }
  .nav:active { color:var(--text); }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="dot"></span>
    <h1>Bonsai-27B</h1>
    <a class="nav" href="/agillm-ui">AGILLM 4.3 &raquo;</a>
    <a class="nav" href="/models">hub</a>
    <span class="sub">private · Q1_0 on GETH</span>
  </header>
  <div id="log"></div>
  <form id="f">
    <textarea id="in" rows="1" placeholder="Message Bonsai…" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>
<script>
const API = "/bonsai-chat/v1/chat/completions";   // nginx injects the API key on this path
const log = document.getElementById("log");
const input = document.getElementById("in");
const form = document.getElementById("f");
const sendBtn = document.getElementById("send");
const history = [];

function add(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : role === "system" ? "sys" : "bot");
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
add("system", "Chatting privately with Bonsai-27B. It's a 1-bit quant, so replies come slowly — that's normal.");

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

form.addEventListener("submit", async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = ""; input.style.height = "auto";
  add("user", text);
  history.push({ role: "user", content: text });
  sendBtn.disabled = true;

  const botDiv = add("assistant", "");
  botDiv.classList.add("blink");
  let acc = "";
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "Bonsai-27B",
        messages: history,
        max_tokens: 512,
        temperature: 0.7,
        stream: true
      })
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith("data:")) continue;
        const payload = t.slice(5).trim();
        if (payload === "[DONE]") continue;
        try {
          const j = JSON.parse(payload);
          const delta = j.choices?.[0]?.delta?.content || "";
          if (delta) { acc += delta; botDiv.textContent = acc; log.scrollTop = log.scrollHeight; }
        } catch (_) {}
      }
    }
    if (!acc) acc = "(empty reply)";
    history.push({ role: "assistant", content: acc });
  } catch (err) {
    botDiv.textContent = "⚠️ " + err.message + " — if this says 403 your phone's IP rotated out of the allow-list; tell Claude to re-add it.";
  } finally {
    botDiv.classList.remove("blink");
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>

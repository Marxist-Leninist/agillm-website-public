# OpenCode access policy:
# - current laptop IP bypasses login
# - every other source MUST pass Linger
# Deliberately independent of the broader AGILLM owner-IP allowlist.
satisfy any;
allow x.x.x.x;
deny all;
auth_request /_opencode_linger_check;
error_page 401 = @opencode_linger_page;
error_page 403 = @opencode_linger_page;

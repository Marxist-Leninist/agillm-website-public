# AGILLM access gate.
# Known owner/server IPs bypass Linger. Unknown IPs may pass with a valid
# Linger cookie or a verified AGILLM client certificate via /_linger_check.
# `satisfy any` is essential: either the IP access module OR auth_request may grant access.
satisfy any;

# Current and previously observed owner-device egress addresses.
allow x.x.x.x;  # owner Android phone, observed 2026-08-21T15:05Z
allow x.x.x.x;  # agent box egress, owner-approved 2026-10-16 (exact /32, IPv4 only)
allow x.x.x.x;  # owner phone Edge Secure-Network VPN egress pool (observed x.x.x.x on 2026-08-18, x.x.x.x on 2026-08-30)
allow x.x.x.x;
allow x.x.x.x;
allow x.x.x.x;
allow x.x.x.x;
allow x.x.x.x;
allow x.x.x.x;

# Owner-controlled servers and private management networks.
allow x.x.x.x;
allow x.x.x.x;
allow x.x.x.x;
allow x.x.x.x;
allow x.x.x.x;
allow 127.0.0.1/32;
allow ::1/128;

deny all;
auth_request /_linger_check;

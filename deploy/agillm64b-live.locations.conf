# AGILLM-64B (bin8) live CPU inference: page + API. claude-chat-64b-improve-20261019, 2026-10-19.
# Backend: serve64b.py on vast 55575647 127.0.0.1:8770 via agillm64b-cpu-tunnel.service (GETH 127.0.0.1:8771).
# Same owner gate as /agillm-ui. Rollback: remove the include line for this file from the edge conf and reload.
location = /agillm-64b/ { return 308 /agillm-64b; }
location = /agillm-64b {
    include /opt/agillm43_netserve/agillm_codex_browser_allow.conf;
    include /opt/agillm43_netserve/agillm_acl.conf;
    error_page 401 = @linger_page;
    error_page 403 = @linger_page;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    alias /opt/agillm43_netserve/agillm64b.html;
}
location = /agillm-64b/api/health {
    include /opt/agillm43_netserve/agillm_codex_browser_allow.conf;
    include /opt/agillm43_netserve/agillm_acl.conf;
    error_page 401 = @linger_page;
    error_page 403 = @linger_page;
    proxy_pass http://127.0.0.1:8771/health;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}
location = /agillm-64b/api/generate {
    include /opt/agillm43_netserve/agillm_codex_browser_allow.conf;
    include /opt/agillm43_netserve/agillm_acl.conf;
    error_page 401 = @linger_page;
    error_page 403 = @linger_page;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8771/generate;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
